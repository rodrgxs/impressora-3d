name: Quality and security
on:
  pull_request:
  push:
    branches: [main, "fix/**", "feature/**", "feat/**"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: peca_test
          POSTGRES_PASSWORD: ci_test_only
          POSTGRES_DB: peca_lab_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://peca_test:ci_test_only@127.0.0.1:5432/peca_lab_test
      DIRECT_URL: postgresql://peca_test:ci_test_only@127.0.0.1:5432/peca_lab_test
      DB_INTEGRATION_TEST: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm run typecheck
      - name: Apply migrations to isolated CI database
        run: npm run db:deploy
      - run: npm run test:integration
      - run: npm run audit:check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
